services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lionban
      POSTGRES_USER: lionban
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data, ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U lionban"], interval: 5s, timeout: 5s, retries: 10 }
  web:
    build: .
    env_file: .env
    ports: ["3000:3000"]
    depends_on: { postgres: { condition: service_healthy } }
  worker:
    build: { context: ., dockerfile: Dockerfile.worker }
    env_file: .env
    volumes: [codex_auth:/root/.codex]
    depends_on: { postgres: { condition: service_healthy } }
    restart: unless-stopped
volumes:
  postgres_data:
  codex_auth:

